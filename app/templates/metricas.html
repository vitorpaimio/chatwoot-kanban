<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Métricas · Pipeline</title>
    <link rel="stylesheet" href="/kanban/static/kanban.css" />
    <link rel="stylesheet" href="/kanban/static/metricas.css" />
    <script src="/kanban/static/theme.js" defer></script>
    <script src="/kanban/static/vendor/chart.umd.js" defer></script>
    <script src="/kanban/static/helpers.js" defer></script>
    <script src="/kanban/static/ui.js" defer></script>
    <script src="/kanban/static/metricas.js" defer></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Métricas</h1>
      <div class="header-actions">
        <span id="metrics-status" role="status"></span>
        <button id="refresh" type="button" class="header-button ghost">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          Atualizar
        </button>
      </div>
    </header>
    <form id="filters" class="metrics-filters" aria-label="Filtros">
      <div class="metrics-toolbar">
        <select id="funnel-filter" aria-label="Funil">
          <option value="">Funil</option>
        </select>
        <select id="period" aria-label="Período">
          <option value="today">Hoje</option>
          <option value="yesterday">Ontem</option>
          <option value="7days">Últimos 7 dias</option>
          <option value="month" selected>Este mês</option>
          <option value="last-month">Mês passado</option>
          <option value="custom">Personalizado</option>
        </select>
        <select id="assignee-filter" aria-label="Responsável">
          <option value="">Responsável</option>
        </select>
        <select id="inbox-filter" aria-label="Caixa de entrada">
          <option value="">Caixa de entrada</option>
        </select>
      </div>
      <div id="custom-range" class="custom-range" hidden>
        <label class="date-field"
          >De<input id="start" type="date" required
        /></label>
        <label class="date-field"
          >Até<input id="end" type="date" required
        /></label>
      </div>
    </form>
    <p id="period-caption" class="period-caption"></p>
    <p id="comparison-note" class="period-caption" hidden></p>
    <p id="filter-warning" class="metrics-error" role="alert" hidden></p>
    <main id="metrics" class="metrics-page">
      <section id="summary" class="metric-block" aria-label="Resumo"></section>
      <section id="funnel" class="metric-block" aria-label="Funil"></section>
      <section
        id="losses"
        class="metric-block"
        aria-label="Motivos de perda"
      ></section>
      <section
        id="sources"
        class="metric-block"
        aria-label="Origem e campanha"
      ></section>
      <section id="team" class="metric-block" aria-label="Equipe"></section>
      <section id="tasks" class="metric-block" aria-label="Tarefas"></section>
      <section
        id="timeline"
        class="metric-block"
        aria-label="Evolução"
      ></section>
    </main>
    <footer class="metrics-footer">
      <p>
        Horários de Brasília. Os valores históricos usam os eventos registrados;
        dados anteriores à instalação podem ter dimensões ou valores
        desconhecidos.
      </p>
      <p>
        Indicadores de atendimento, como conversas e tempo de resposta, estão
        nos Relatórios do Chatwoot.
      </p>
    </footer>
  </body>
</html>
