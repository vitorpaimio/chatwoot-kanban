<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kanban · Chatwoot</title>
    <link rel="stylesheet" href="/kanban/static/kanban.css" />
  </head>
  <body class="board-page">
    <header class="page-header">
      <div id="funnel-picker" class="funnel-title"></div>
      <!-- Estado do tempo real; para administrador, atalho para Configurações. -->
      <button
        id="status-link"
        type="button"
        class="status-link"
        title="Conectando…"
        aria-label="Conectando…"
      >
        <span
          id="connection"
          class="connection"
          role="status"
          aria-label="Conectando…"
          title="Conectando…"
          data-state="connecting"
        ></span>
      </button>
      <!-- Ações do funil, antes dentro de "Gerenciar funil" (ADR-045). -->
      <div id="funnel-actions" class="header-actions" hidden>
        <button
          id="manage"
          class="header-button ghost"
          title="Gerenciar etapas do funil"
          aria-label="Gerenciar etapas do funil"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18M15 3v18" /></svg
          >Etapas
        </button>
        <details id="funnel-menu" class="more-actions">
          <summary
            class="icon-button ghost"
            aria-label="Mais ações do funil"
            title="Mais ações do funil"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" />
            </svg>
          </summary>
          <div class="action-menu">
            <button id="edit-funnel">Editar funil</button>
            <button id="archive-funnel" class="danger-item">Arquivar funil</button>
          </div>
        </details>
        <span class="header-separator" aria-hidden="true"></span>
        <button id="new-funnel" class="header-button faded">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" /></svg
          >Novo funil
        </button>
      </div>
    </header>
    <div id="notice" role="status" hidden></div>
    <section
      id="activation"
      class="setup"
      aria-labelledby="setup-title"
      aria-live="polite"
      hidden
    >
      <div class="setup-card">
        <svg
          id="setup-spinner"
          class="spinner"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <h2 id="setup-title"></h2>
        <p id="setup-text"></p>
        <form id="activate-form" hidden>
          <label for="service-token">Token de acesso</label>
          <input
            id="service-token"
            type="password"
            required
            autocomplete="off"
            aria-describedby="token-help token-error"
          />
          <p id="token-help" class="field-help">
            Use o token de um administrador desta conta: no Chatwoot, abra
            Configurações do Perfil e copie o Token de acesso. Ele será guardado
            criptografado.
          </p>
          <p id="token-error" class="field-error" role="alert" hidden></p>
          <button id="activate-submit" class="primary">Ativar Pipeline</button>
        </form>
        <div id="setup-actions" class="setup-actions" hidden></div>
      </div>
    </section>
    <nav class="toolbar" aria-label="Ações e filtros do quadro">
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          id="search"
          type="search"
          aria-label="Pesquisar negociações"
          placeholder="Pesquisar..."
        />
      </div>
      <span class="toolbar-spacer"></span>
      <select id="assignee" aria-label="Responsável">
        <option value="">Responsável</option>
      </select>
      <select id="label" aria-label="Etiqueta">
        <option value="">Etiqueta</option>
      </select>
      <select id="task-filter" aria-label="Filtrar por tarefa">
        <option value="">Tarefa</option>
        <option value="none">Sem tarefa</option>
        <option value="active">Agendadas</option>
        <option value="today">Vencem hoje</option>
        <option value="overdue">Vencidas</option>
      </select>
      <details id="more-actions" class="more-actions">
        <summary
          class="icon-button ghost"
          aria-label="Mais ações"
          title="Mais ações"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" />
          </svg>
        </summary>
        <div class="action-menu">
          <button id="history">Histórico</button>
        </div>
      </details>
      <span class="header-separator" aria-hidden="true"></span>
      <button id="add-card" class="primary">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" /></svg
        >Adicionar negociação
      </button>
    </nav>
    <div class="board-status">
      <span id="summary"></span>
      <div id="sync-warning" role="status" hidden>
        <span id="sync-count"></span
        ><button id="retry" hidden>Repetir sincronização</button>
      </div>
    </div>
    <main id="board" aria-label="Quadro Kanban"></main>
    <dialog id="dialog">
      <form id="dialog-form">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button type="button" id="dialog-close" aria-label="Fechar">×</button>
        </div>
        <div id="dialog-content"></div>
        <div class="dialog-actions">
          <button type="submit" id="dialog-save">Salvar</button>
        </div>
      </form>
    </dialog>
    <script src="/kanban/static/theme.js"></script>
    <script src="/kanban/static/helpers.js" defer></script>
    <script src="/kanban/static/ui.js" defer></script>
    <script src="/kanban/static/kanban.js" defer></script>
  </body>
</html>
