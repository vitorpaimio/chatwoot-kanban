services:
  api:
    build: .
    env_file: .env
    ports: ['127.0.0.1:8000:8000']
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: [python, -m, app.worker]
    healthcheck:
      disable: true
    restart: unless-stopped
# O banco e o Chatwoot são externos. Execute Alembic antes de iniciar os serviços.
# Para Swarm/Traefik, use deploy/stack.yml e o procedimento documentado.
