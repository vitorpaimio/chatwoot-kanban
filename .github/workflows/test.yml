name: Validar e publicar
on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test
      TEST_DATABASE_URL: postgresql://kanban:kanban@localhost:5432/kanban_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - run: ruff check app installer migrations scripts tests deploy
      - run: alembic upgrade head
      - run: pytest -q
      - name: Validar sintaxe JavaScript
        run: |
          for file in app/static/*.js tests/*.cjs tests/browser/*.cjs; do
            node --check "$file"
          done
      - run: node --test tests/test_interface.cjs
      - run: sh -n install.sh
  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Registrar imagem imutável do commit testado
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > image-digest.txt
          printf 'Commit testado: `%s`\n\nImagem: `%s@%s`\n' \
            "$GITHUB_SHA" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
      - name: Publicar instalador com runtime do mesmo commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.installer
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            KANBAN_IMAGE=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          tags: |
            ${{ steps.image.outputs.name }}:installer-sha-${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ensaio descartável com Chatwoot real
        run: |
          pip install -r requirements.txt pyyaml
          npm ci
          npx playwright install --with-deps chromium
      - name: Validar instalação automática e navegador
        timeout-minutes: 25
        env:
          INSTALLER_CANDIDATE: ${{ steps.image.outputs.name }}:installer-sha-${{ github.sha }}
          KANBAN_DISPOSABLE_CI: quickstart
          PYTHONPATH: .
        run: python tests/contracts/quickstart_ci.py
      - name: Disponibilizar instalador aprovado
        env:
          INSTALLER_CANDIDATE: ${{ steps.image.outputs.name }}:installer-sha-${{ github.sha }}
          INSTALLER_PUBLIC: ${{ steps.image.outputs.name }}:installer-${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$INSTALLER_PUBLIC" "$INSTALLER_CANDIDATE"
          # Scripts antigos ainda baixam installer-master; a tag segue a main.
          if [ "${{ github.ref_name }}" = main ]; then
            docker buildx imagetools create \
              --tag "${INSTALLER_PUBLIC%:*}:installer-master" "$INSTALLER_CANDIDATE"
          fi
